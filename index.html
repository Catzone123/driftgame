<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Drift Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .hud-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
    .hud-stat {
      font-size: 18px;
      margin: 3px 0;
    }
    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div id="ui">
    <div class="hud-title">DRIFT SIMULATOR</div>
    <div class="hud-stat" id="speedometer">Speed: 0 km/h</div>
    <div class="hud-stat" id="drift-score">Drift Points: 0</div>
  </div>

  <div id="controls-hint">
    <b>Controls:</b> W/Up = Accelerate | S/Down = Reverse/Brake | A/D or Left/Right = Steer | Space = Handbrake (Drift)
  </div>

  <script>
    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd0e0f0, 0.005);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.2);
    sun.position.set(100, 150, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 500;
    const d = 100;
    sun.shadow.camera.left = -d;
    sun.shadow.camera.right = d;
    sun.shadow.camera.top = d;
    sun.shadow.camera.bottom = -d;
    scene.add(sun);

    // --- Environment / Ground ---
    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    const groundMat = new THREE.MeshStandardMaterial({ 
      color: 0x222225, 
      roughness: 0.6, 
      metalness: 0.2 
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid markings on floor for visual speed reference
    const grid = new THREE.GridHelper(1000, 100, 0x555555, 0x333333);
    grid.position.y = 0.01;
    scene.add(grid);

    // Decorative Environment Pillars/Obstacles
    const pillarGeo = new THREE.BoxGeometry(4, 12, 4);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.5 });
    for (let i = 0; i < 40; i++) {
      const pillar = new THREE.Mesh(pillarGeo, pillarMat);
      const angle = Math.random() * Math.PI * 2;
      const radius = 30 + Math.random() * 150;
      pillar.position.set(Math.cos(angle) * radius, 6, Math.sin(angle) * radius);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
    }

    // --- Car Construction ---
    const carGroup = new THREE.Group();
    scene.add(carGroup);

    // Car Body
    const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4.2);
    const bodyMat = new THREE.MeshPhysicalMaterial({
      color: 0xd63031,
      metalness: 0.7,
      roughness: 0.2,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });
    const carBody = new THREE.Mesh(bodyGeo, bodyMat);
    carBody.position.y = 0.7;
    carBody.castShadow = true;
    carGroup.add(carBody);

    // Cabin / Glass
    const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
    const cabinMat = new THREE.MeshPhysicalMaterial({ color: 0x111111, roughness: 0.1, transmission: 0.6, transparent: true });
    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
    cabin.position.set(0, 1.3, -0.2);
    cabin.castShadow = true;
    carGroup.add(cabin);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 24);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
    const wheels = [];
    const wheelPositions = [
      { x: -1, y: 0.35, z: 1.3 },  // Front Left
      { x: 1, y: 0.35, z: 1.3 },   // Front Right
      { x: -1, y: 0.35, z: -1.3 }, // Rear Left
      { x: 1, y: 0.35, z: -1.3 }   // Rear Right
    ];

    wheelPositions.forEach((pos, idx) => {
      const wheelPivot = new THREE.Group();
      wheelPivot.position.set(pos.x, pos.y, pos.z);
      
      const wheelMesh = new THREE.Mesh(wheelGeo, wheelMat);
      wheelMesh.rotation.z = Math.PI / 2;
      wheelMesh.castShadow = true;
      
      wheelPivot.add(wheelMesh);
      carGroup.add(wheelPivot);
      wheels.push({ pivot: wheelPivot, mesh: wheelMesh, isFront: idx < 2 });
    });

    // --- Controls & Input ---
    const keys = { forward: false, backward: false, left: false, right: false, handbrake: false };

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.forward = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.backward = true;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
      if (e.code === 'Space') keys.handbrake = true;
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.forward = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.backward = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
      if (e.code === 'Space') keys.handbrake = false;
    });

    // --- Physics Variables ---
    let carPos = new THREE.Vector3(0, 0, 0);
    let velocity = new THREE.Vector3(0, 0, 0);
    let carHeading = 0; // Angle in radians
    let steerAngle = 0;
    let totalDriftScore = 0;

    const maxSteer = 0.5;
    const accel = 18;
    const maxSpeed = 35;
    const friction = 0.98;

    // --- Main Game Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      // 1. Steering Logic
      const targetSteer = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
      steerAngle += (targetSteer * maxSteer - steerAngle) * 0.1;

      // Rotate Front Wheels visually
      wheels.forEach(w => {
        if (w.isFront) w.pivot.rotation.y = steerAngle;
      });

      // 2. Acceleration & Forward/Backward Force
      const speed = velocity.length();
      const forwardDir = new THREE.Vector3(Math.sin(carHeading), 0, Math.cos(carHeading));
      
      if (keys.forward) {
        velocity.addScaledVector(forwardDir, accel * dt);
      }
      if (keys.backward) {
        velocity.addScaledVector(forwardDir, -accel * 0.5 * dt);
      }

      // Cap Speed
      if (velocity.length() > maxSpeed) {
        velocity.normalize().multiplyScalar(maxSpeed);
      }

      // 3. Drift Physics & Lateral Friction
      const rightDir = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), forwardDir).normalize();
      const forwardVelocity = forwardDir.clone().multiplyScalar(velocity.dot(forwardDir));
      const lateralVelocity = rightDir.clone().multiplyScalar(velocity.dot(rightDir));

      // Drift factor reduces lateral grip when handbrake is held or turning hard at speed
      let grip = keys.handbrake ? 0.82 : 0.94;
      
      // Update Velocity with separated forward and reduced lateral components
      velocity = forwardVelocity.add(lateralVelocity.multiplyScalar(grip));
      velocity.multiplyScalar(friction); // Environmental Drag

      // 4. Vehicle Heading Rotation
      if (speed > 0.5) {
        const directionMultiplier = velocity.dot(forwardDir) >= 0 ? 1 : -1;
        carHeading += steerAngle * (speed / maxSpeed) * 1.8 * directionMultiplier * dt;
      }

      // Update Car Position & Rotation
      carPos.addScaledVector(velocity, dt);
      carGroup.position.copy(carPos);
      carGroup.rotation.y = carHeading;

      // Animate Wheels Turning
      const wheelRotationSpeed = velocity.dot(forwardDir) * dt * 3;
      wheels.forEach(w => w.mesh.rotation.x += wheelRotationSpeed);

      // 5. Drift Scoring Logic
      const driftAngle = Math.abs(velocity.clone().normalize().dot(rightDir));
      if (speed > 8 && driftAngle > 0.3) {
        const points = Math.floor(speed * driftAngle * 10 * dt);
        totalDriftScore += points;
      }

      // 6. Camera Follow System
      const cameraOffset = new THREE.Vector3(0, 5, -12).applyAxisAngle(new THREE.Vector3(0, 1, 0), carHeading);
      const targetCameraPos = carPos.clone().add(cameraOffset);
      camera.position.lerp(targetCameraPos, 0.1);
      camera.lookAt(carPos.clone().add(new THREE.Vector3(0, 1, 2).applyAxisAngle(new THREE.Vector3(0, 1, 0), carHeading)));

      // 7. Update UI HUD
      document.getElementById('speedometer').innerText = `Speed: ${Math.round(speed * 3.6)} km/h`;
      document.getElementById('drift-score').innerText = `Drift Points: ${Math.floor(totalDriftScore)}`;

      renderer.render(scene, camera);
    }

    // --- Window Resize Handling ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
